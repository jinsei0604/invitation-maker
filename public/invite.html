<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招待状 | Invitation</title>
<!-- OGP_META -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="invite.css">
</head>
<body class="theme-standard">

<div class="bg-scene" id="bgScene" aria-hidden="true"></div>

<div class="stage">

    <div class="scene" id="scene">

        <!-- 読み込み中 -->
        <div class="state state-loading" id="state-loading">
            <div class="seal seal--pending"></div>
            <p class="label">確認しています…</p>
        </div>

        <!-- タップで開封 -->
        <div class="state state-tap" id="state-tap" hidden>
            <button class="seal seal--locked" id="tapSealButton" aria-label="封を開ける" type="button">
                <span class="seal__ridge"></span>
                <svg class="seal__glyph" viewBox="-78 -98 156 166" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M-28,15 Q-28,-15 0,-15 Q28,-15 28,15 Q28,45 0,58 Q-28,45 -28,15 Z" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
                    <path d="M-22,-12 C-58,-18 -72,-48 -52,-72 C-42,-84 -22,-80 -20,-66" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                    <path d="M22,-12 C58,-18 72,-48 52,-72 C42,-84 22,-80 20,-66" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                    <path d="M14,-24 L4,-40 L-6,-38 L-70,-95" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                    <circle cx="14" cy="-24" r="7" fill="currentColor"/>
                    <circle cx="4" cy="-40" r="4.4" fill="currentColor"/>
                    <circle cx="-6" cy="-38" r="4" fill="currentColor"/>
                    <circle cx="-70" cy="-95" r="5.4" fill="currentColor"/>
                </svg>
            </button>
            <p class="eyebrow">INVITATION</p>
            <h1 id="tapTitle">招待状が届いています</h1>
            <p class="sub">封をタップして、招待状を開いてください。</p>
            <p class="tap-hint">封をタップして開ける</p>
        </div>

        <!-- 開封アニメーション -->
        <div class="state state-opening" id="state-opening" hidden>
            <div class="envelope-scene" id="envelopeScene">
                <div class="envelope">

                    <!-- 封筒本体のイラスト（切手・折り目の縫い目線） -->
                    <svg class="envelope__art" viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#fdfbf4"/>
                                <stop offset="100%" stop-color="#f2e8cd"/>
                            </linearGradient>
                        </defs>
                        <rect x="1.5" y="1.5" width="217" height="157" rx="7" fill="url(#paperGrad)" stroke="#ddd2b0" stroke-width="1.2"/>
                        <path d="M4 5 L110 88 L216 5" fill="none" stroke="#d9cca4" stroke-width="1.3"/>
                        <path d="M4 155 L82 96" fill="none" stroke="#e4d9b8" stroke-width="1"/>
                        <path d="M216 155 L138 96" fill="none" stroke="#e4d9b8" stroke-width="1"/>
                        <g transform="translate(164,14) rotate(5)">
                            <rect x="0" y="0" width="34" height="28" rx="1.5" fill="#fffdf7" stroke="#cabf9c" stroke-width="1" stroke-dasharray="2.4 2"/>
                            <path d="M5 21 L17 7 L29 21 Z" fill="none" stroke="#c7a15f" stroke-width="1.1"/>
                            <circle cx="17" cy="12" r="3.2" fill="none" stroke="#c7a15f" stroke-width="1"/>
                        </g>
                    </svg>

                    <!-- 手紙本体：最初は封筒の中に隠れている -->
                    <div class="envelope__letter">
                        <div class="envelope__letter-inner">
                            <svg class="scribble" viewBox="0 0 100 8" preserveAspectRatio="none"><path d="M2 5 Q10 1 18 5 T34 5 T50 5 T66 5 T82 5 T98 4" /></svg>
                            <svg class="scribble" viewBox="0 0 100 8" preserveAspectRatio="none"><path d="M2 4 Q9 6 17 3 T33 4 T49 5 T65 3 T81 5 T96 4" /></svg>
                            <svg class="scribble scribble--short" viewBox="0 0 100 8" preserveAspectRatio="none"><path d="M2 5 Q11 2 20 5 T38 4 T56 5" /></svg>
                        </div>
                    </div>

                    <!-- フタ：三角形、上端を軸に開く -->
                    <div class="envelope__flap"></div>
                    <div class="seal seal--locked seal--onflap" id="animSeal">
                        <span class="seal__ridge"></span>
                        <svg class="seal__glyph" viewBox="-78 -98 156 166" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M-28,15 Q-28,-15 0,-15 Q28,-15 28,15 Q28,45 0,58 Q-28,45 -28,15 Z" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
                    <path d="M-22,-12 C-58,-18 -72,-48 -52,-72 C-42,-84 -22,-80 -20,-66" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                    <path d="M22,-12 C58,-18 72,-48 52,-72 C42,-84 22,-80 20,-66" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                    <path d="M14,-24 L4,-40 L-6,-38 L-70,-95" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                    <circle cx="14" cy="-24" r="7" fill="currentColor"/>
                    <circle cx="4" cy="-40" r="4.4" fill="currentColor"/>
                    <circle cx="-6" cy="-38" r="4" fill="currentColor"/>
                    <circle cx="-70" cy="-95" r="5.4" fill="currentColor"/>
                </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- 開封済み内容表示 -->
        <div class="state state-revealed" id="state-revealed" hidden>
            <p class="eyebrow">INVITATION</p>
            <h1 id="revealTitle"></h1>
            <div class="event-meta" id="revealMeta" hidden>
                <div class="event-meta__row" id="revealDateRow" hidden>
                    <span class="event-meta__label">日時</span>
                    <span id="revealDate"></span>
                </div>
                <div class="event-meta__row" id="revealLocationRow" hidden>
                    <span class="event-meta__label">場所</span>
                    <span id="revealLocation"></span>
                </div>
            </div>
            <div class="paper">
                <p class="paper__text" id="secretText"></p>
            </div>

            <div class="rsvp" id="rsvpSection" hidden>
                <div class="rsvp-form-wrap" id="rsvpFormWrap">
                    <h2 class="rsvp__heading">出欠のご返信</h2>
                    <form id="rsvpForm">
                        <label class="field">
                            <span class="field__label">お名前 <span class="required">必須</span></span>
                            <input type="text" id="rsvpName" maxlength="60" required>
                        </label>

                        <label class="field">
                            <span class="field__label">役職・学年</span>
                            <input type="text" id="rsvpRole" maxlength="40" placeholder="例：営業部 課長 / 3年">
                        </label>

                        <div class="field">
                            <span class="field__label">出欠 <span class="required">必須</span></span>
                            <div class="rsvp-attend-picker" id="rsvpAttendPicker">
                                <button type="button" class="rsvp-attend-btn" data-attend="yes">出席</button>
                                <button type="button" class="rsvp-attend-btn" data-attend="no">欠席</button>
                            </div>
                        </div>

                        <label class="field" id="rsvpCompanionField" hidden>
                            <span class="field__label">同伴者人数</span>
                            <input type="number" id="rsvpCompanionCount" min="0" max="20" step="1" value="0" inputmode="numeric">
                        </label>

                        <label class="field">
                            <span class="field__label">ひとことメッセージ</span>
                            <textarea id="rsvpComment" rows="3" maxlength="300"></textarea>
                        </label>

                        <p class="error-text" id="rsvpError" hidden></p>

                        <button type="submit" class="btn-primary">送信する</button>
                    </form>
                </div>

                <div class="rsvp-done" id="rsvpDone" hidden>
                    <h2 class="rsvp__heading">ご回答ありがとうございました</h2>
                    <p class="sub" id="rsvpDoneSub"></p>
                    <button type="button" class="btn-secondary" id="rsvpAnotherBtn">別の方の回答を送る</button>
                </div>
            </div>

            <div class="rsvp" id="scheduleSection" hidden>
                <div class="rsvp-form-wrap" id="scheduleFormWrap">
                    <h2 class="rsvp__heading">日程調整のご協力をお願いします</h2>
                    <form id="scheduleForm">
                        <label class="field">
                            <span class="field__label">お名前 <span class="required">必須</span></span>
                            <input type="text" id="scheduleName" maxlength="60" required>
                        </label>

                        <label class="field">
                            <span class="field__label">役職・学年</span>
                            <input type="text" id="scheduleRole" maxlength="40" placeholder="例：営業部 課長 / 3年">
                        </label>

                        <div class="field">
                            <span class="field__label">参加できる候補日 <span class="required">必須・1つ以上</span></span>
                            <div class="schedule-vote-options" id="scheduleVoteOptions"></div>
                        </div>

                        <label class="field">
                            <span class="field__label">ひとことメッセージ</span>
                            <textarea id="scheduleComment" rows="3" maxlength="300"></textarea>
                        </label>

                        <p class="error-text" id="scheduleError" hidden></p>

                        <button type="submit" class="btn-primary">送信する</button>
                    </form>
                </div>

                <div class="rsvp-done" id="scheduleDone" hidden>
                    <h2 class="rsvp__heading">ご回答ありがとうございました</h2>
                    <p class="sub" id="scheduleDoneSub"></p>
                    <button type="button" class="btn-secondary" id="scheduleAnotherBtn">別の方の回答を送る</button>
                </div>
            </div>

            <div class="rsvp" id="responseClosedSection" hidden>
                <h2 class="rsvp__heading">受付は終了しました</h2>
                <p class="sub" id="responseClosedReason"></p>
            </div>

            <p class="sub sub--quiet">このページはいつでも開き直せます。ブックマークしてご確認ください。</p>
        </div>

        <!-- エラー（見つからない・未払いなど） -->
        <div class="state state-error" id="state-error" hidden>
            <div class="seal seal--gone"></div>
            <p class="eyebrow">NOT FOUND</p>
            <h1 id="errorTitle">この招待状は見つかりません</h1>
            <p class="sub" id="errorSub">URLが正しいかご確認ください。</p>
        </div>

    </div>

</div>

<script src="templates.js"></script>
<script src="invite.js"></script>
</body>
</html>
